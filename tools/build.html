<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<title>ASCII Hachiware builder</title>
<style>
  body { background: #111; color: #ccc; font: 13px/1.5 system-ui, sans-serif; margin: 16px; }
  button, input { font: inherit; }
  .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
  .views { display: flex; gap: 8px; flex-wrap: wrap; }
  canvas { background: #000; max-width: 100%; }
  #src, #out { width: 480px; height: 360px; }
  #log { white-space: pre-wrap; font: 12px/1.4 Consolas, monospace; color: #9c9; max-height: 220px; overflow: auto; }
  /* must stay rendered (not display:none) or requestVideoFrameCallback never fires */
  video { position: fixed; right: 0; bottom: 0; width: 64px; height: 36px; opacity: 0.05; pointer-events: none; }
</style>
</head>
<body>
<!--
  Builder for ascii_data.js. Must be served over http (node tools/server.js) so the
  video can be seeked and read back with getImageData. Open
  http://127.0.0.1:8766/tools/build.html, check a few frames with "預覽", then "產生全片".
-->
<div class="row">
  <label>時間 <input id="t" type="number" step="0.1" value="15" style="width:80px" /> 秒</label>
  <button id="btnPreview">預覽</button>
  <button id="btnBuild">產生全片並存檔</button>
  <span id="status"></span>
</div>
<div class="views">
  <canvas id="src" width="480" height="360"></canvas>
  <canvas id="out" width="960" height="720"></canvas>
</div>
<div id="log"></div>
<video id="video" muted playsinline preload="auto"></video>

<script src="../renderer.js"></script>
<script>
(() => {
  // ---------------------------------------------------------------- settings
  const VIDEO = "../【ちいかわ】ひとりごつ.mp4";
  const FPS = 24;
  const FW = 640, FH = 360;           // working resolution of the whole 16:9 frame
  const SUBX = 3, SUBY = 5;           // pixels per letter cell (cell aspect 0.6, like a mono font)
  const FCOLS = Math.floor(FW / SUBX); // 213 cells across the whole frame
  const ROWS = FH / SUBY;              // 72
  const COLS = 160;                    // shown columns: a 4:3 window that follows Hachiware per shot
  const RAMP = " .,:;ceadoaeocd#$%&8BQ0O0OQ";
  const NR = RAMP.length - 1;          // 27 printable steps
  const LEAF_MAX_IDX = 14;             // bushes use the thin letters only

  // pixel classes
  const INK = 0, WHITE = 1, HAIR = 2, BLUSH = 3, WOOD = 4, LEAF = 5, OTHER = 6, FUR = 7, PAPER = 8;
  // paint groups that get letters (palette group = position in this list)
  const PAINTS = [FUR, HAIR, BLUSH, WOOD, LEAF];
  const LOOK = {
    [FUR]:   { col: [236, 238, 242], floor: 0.15, puffy: true },
    [HAIR]:  { col: [104, 170, 244], floor: 0.18, puffy: true },
    [BLUSH]: { col: [244, 140, 176], floor: 0.12, puffy: true },
    [WOOD]:  { col: [214, 140, 74],  floor: 0.16, puffy: true },
    [LEAF]:  { col: [120, 184, 96],  floor: 0.10, puffy: false },
  };
  const LEVELS = 16;
  const STILL = 8, EASE = 0.3, MARGIN = 0.15;
  let ERODE = 3;                      // erosion steps before labelling white patches
  const CUT = 22;                     // mean colour change that counts as a cut
  const LIGHT = (() => { const l = [-0.45, -0.55, 0.70]; const n = Math.hypot(...l); return l.map((v) => v / n); })();

  const palette = [];
  for (const k of PAINTS) {
    for (let q = 0; q < LEVELS; q++) {
      const lv = q / (LEVELS - 1);
      const m = 0.72 + 0.36 * lv;
      const [r, g, b] = LOOK[k].col.map((v) => Math.min(255, Math.round(v * m)));
      palette.push(`rgb(${r},${g},${b})`);
    }
  }

  let video = document.getElementById("video");
  const work = document.createElement("canvas");
  work.width = FW; work.height = FH;
  const wctx = work.getContext("2d", { willReadFrequently: true });
  wctx.imageSmoothingQuality = "high";
  const logEl = document.getElementById("log");
  const statusEl = document.getElementById("status");
  const log = (s) => {
    logEl.textContent += s + "\n";
    logEl.scrollTop = 1e9;
    fetch("/log", { method: "POST", body: String(s) }).catch(() => {});
  };

  // ---------------------------------------------------------------- pixels
  function classify(d) {
    const N = FW * FH;
    const k = new Uint8Array(N);
    for (let i = 0, p = 0; i < N; i++, p += 4) {
      const r = d[p], g = d[p + 1], b = d[p + 2];
      const lum = (r + g + b) / 3;
      const mx = r > g ? (r > b ? r : b) : (g > b ? g : b);
      const mn = r < g ? (r < b ? r : b) : (g < b ? g : b);
      const ch = mx - mn;
      let c;
      if (lum < 95 || (lum < 135 && ch < 40)) c = INK;          // dark brown outline
      else if (g > r + 8 && g > b + 12) c = LEAF;
      else if (b > r + 20 && b > 100) c = HAIR;
      else if (r > g + 20 && r > 170 && b > g - 8) c = BLUSH;
      else if (r > b + 30 && r > g + 5) c = WOOD;
      else if (lum > 200 && ch <= 18) c = WHITE;
      else c = lum < 150 ? INK : OTHER;                         // anti-aliased edge pixels
      k[i] = c;
    }
    return k;
  }

  // White fur and the off-white paper have the same colour in this video, so decide per white
  // patch by topology: a patch is fur if ink closes it in (it never reaches the frame edge) or
  // if it touches a blush. Everything else white is paper and stays black.
  function furOrPaper(k) {
    const N = FW * FH;
    const white = new Uint8Array(N);
    for (let i = 0; i < N; i++) white[i] = k[i] === WHITE ? 1 : 0;
    // erode (8-neighbour; outside the frame counts as white) to cut thin leaks through
    // outlines that the video compression has washed out
    let core = white;
    for (let it = 0; it < ERODE; it++) {
      const src = core;
      core = new Uint8Array(N);
      for (let y = 0; y < FH; y++) {
        for (let x = 0; x < FW; x++) {
          const i = y * FW + x;
          if (!src[i]) continue;
          let ok = 1;
          for (let dy = -1; dy <= 1 && ok; dy++) for (let dx = -1; dx <= 1; dx++) {
            const xx = x + dx, yy = y + dy;
            if (xx < 0 || yy < 0 || xx >= FW || yy >= FH) continue;
            if (!src[yy * FW + xx]) { ok = 0; break; }
          }
          core[i] = ok;
        }
      }
    }
    // blush neighbourhood (must reach past the eroded rim)
    let near = new Uint8Array(N);
    // seeds: blush pixels inside a blush patch (lone pinkish pixels on wood edges don't count)
    for (let i = FW; i < N - FW; i++) {
      near[i] = k[i] === BLUSH && k[i - 1] === BLUSH && k[i + 1] === BLUSH && k[i - FW] === BLUSH && k[i + FW] === BLUSH ? 1 : 0;
    }
    for (let it = 0; it < ERODE + 3; it++) {
      const nx = near.slice();
      for (let y = 0; y < FH; y++) {
        for (let x = 0; x < FW; x++) {
          const i = y * FW + x;
          if (near[i]) continue;
          if ((x > 0 && near[i - 1]) || (x < FW - 1 && near[i + 1]) || (y > 0 && near[i - FW]) || (y < FH - 1 && near[i + FW])) nx[i] = 1;
        }
      }
      near = nx;
    }
    // label the eroded patches
    const lab = new Int32Array(N);
    const isFur = [false];
    const stack = new Int32Array(N);
    let n = 0;
    for (let s = 0; s < N; s++) {
      if (!core[s] || lab[s]) continue;
      n++;
      let sp = 0, border = false, blush = false;
      stack[sp++] = s; lab[s] = n;
      while (sp) {
        const i = stack[--sp];
        const x = i % FW, y = (i - x) / FW;
        if (x === 0 || y === 0 || x === FW - 1 || y === FH - 1) border = true;
        if (near[i]) blush = true;
        if (x > 0 && core[i - 1] && !lab[i - 1]) { lab[i - 1] = n; stack[sp++] = i - 1; }
        if (x < FW - 1 && core[i + 1] && !lab[i + 1]) { lab[i + 1] = n; stack[sp++] = i + 1; }
        if (y > 0 && core[i - FW] && !lab[i - FW]) { lab[i - FW] = n; stack[sp++] = i - FW; }
        if (y < FH - 1 && core[i + FW] && !lab[i + FW]) { lab[i + FW] = n; stack[sp++] = i + FW; }
      }
      isFur.push(!border || blush);
    }
    // give the eroded rim back to the neighbouring patch
    for (let it = 0; it < ERODE + 1; it++) {
      const nl = lab.slice();
      for (let i = 0; i < N; i++) {
        if (!white[i] || lab[i]) continue;
        const x = i % FW;
        const l = (x > 0 && lab[i - 1]) || (x < FW - 1 && lab[i + 1]) || (i >= FW && lab[i - FW]) || (i < N - FW && lab[i + FW]) || 0;
        if (l) nl[i] = l;
      }
      lab.set(nl);
    }
    for (let i = 0; i < N; i++) {
      if (!white[i]) continue;
      k[i] = lab[i] ? (isFur[lab[i]] ? FUR : PAPER) : FUR;  // tiny slivers between ink: fur
    }
    if (window.__dbgLabels) window.__dbgLabels = { lab, core, n, isFur, near };
    return k;
  }

  // ---------------------------------------------------------------- cells
  // Turn one frame into per-cell letters for the whole frame width (cropping happens later,
  // per shot). prev carries the previous frame of the same shot for easing / hysteresis.
  function cells(d, k, prev) {
    const NC = ROWS * FCOLS;
    const rgb = new Float32Array(NC * 3);
    const ink = new Float32Array(NC);
    const major = new Uint8Array(NC);
    const leafLum = new Float32Array(NC);
    const counts = new Uint8Array(NC * 9);
    const per = SUBX * SUBY;
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < FCOLS; c++) {
        const ci = r * FCOLS + c;
        let sr = 0, sg = 0, sb = 0, ll = 0, ln = 0;
        const cnt = counts.subarray(ci * 9, ci * 9 + 9);
        for (let yy = 0; yy < SUBY; yy++) {
          const y = r * SUBY + yy;
          for (let xx = 0; xx < SUBX; xx++) {
            const i = y * FW + c * SUBX + xx;
            const p = i * 4;
            sr += d[p]; sg += d[p + 1]; sb += d[p + 2];
            const kk = k[i];
            cnt[kk]++;
            if (kk === LEAF) { ll += (d[p] + d[p + 1] + d[p + 2]) / 3; ln++; }
          }
        }
        rgb[ci * 3] = sr / per; rgb[ci * 3 + 1] = sg / per; rgb[ci * 3 + 2] = sb / per;
        ink[ci] = cnt[INK] / per;
        leafLum[ci] = ln ? ll / ln : 180;
        let best = PAPER, bc = 0;
        for (const kk of [FUR, PAPER, HAIR, BLUSH, WOOD, LEAF]) {
          if (cnt[kk] > bc) { bc = cnt[kk]; best = kk; }
        }
        major[ci] = best;
      }
    }

    // what moved since the previous frame of this shot
    const moved = new Uint8Array(NC).fill(1);
    if (prev) {
      for (let i = 0; i < NC; i++) {
        const dm = Math.max(Math.abs(rgb[i * 3] - prev.rgb[i * 3]), Math.abs(rgb[i * 3 + 1] - prev.rgb[i * 3 + 1]), Math.abs(rgb[i * 3 + 2] - prev.rgb[i * 3 + 2]));
        moved[i] = dm > STILL ? 1 : 0;
      }
      const m2 = moved.slice();
      for (let r = 0; r < ROWS; r++) for (let c = 0; c < FCOLS; c++) {
        const i = r * FCOLS + c;
        if (moved[i]) continue;
        if ((c > 0 && moved[i - 1]) || (c < FCOLS - 1 && moved[i + 1]) || (r > 0 && moved[i - FCOLS]) || (r < ROWS - 1 && moved[i + FCOLS])) m2[i] = 1;
      }
      moved.set(m2);
      for (let i = 0; i < NC; i++) {
        if (moved[i]) continue;
        ink[i] = prev.ink[i] + EASE * (ink[i] - prev.ink[i]);
        const held = counts[i * 9 + prev.major[i]];
        if (held >= 0.6 * counts[i * 9 + major[i]]) major[i] = prev.major[i];
      }
    }

    // ink holes: thick ink on its own, thin ink only where it is a lone line
    const hole = new Uint8Array(NC);
    const solid = new Uint8Array(NC);
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < FCOLS; c++) {
      const i = r * FCOLS + c;
      let s = 0, n = 0;
      for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
        const rr = r + dr, cc = c + dc;
        if (rr < 0 || cc < 0 || rr >= ROWS || cc >= FCOLS) continue;
        s += ink[rr * FCOLS + cc]; n++;
      }
      const nearInk = s / n;
      const lift = prev ? (prev.hole[i] ? -MARGIN : MARGIN) : 0;
      hole[i] = (ink[i] > 0.5 + lift || (ink[i] > 0.25 + lift && nearInk < 0.35)) ? 1 : 0;
      solid[i] = !hole[i] && major[i] !== PAPER ? 1 : 0;
    }

    // puff height: distance to the silhouette edge (holes inside are filled first)
    const outside = new Uint8Array(NC);
    {
      const st = [];
      for (let r = 0; r < ROWS; r++) for (let c = 0; c < FCOLS; c++) {
        if (r === 0 || c === 0 || r === ROWS - 1 || c === FCOLS - 1) {
          const i = r * FCOLS + c;
          if (!solid[i] && !outside[i]) { outside[i] = 1; st.push(i); }
        }
      }
      while (st.length) {
        const i = st.pop();
        const c = i % FCOLS, r = (i - c) / FCOLS;
        const nb = [c > 0 ? i - 1 : -1, c < FCOLS - 1 ? i + 1 : -1, r > 0 ? i - FCOLS : -1, r < ROWS - 1 ? i + FCOLS : -1];
        for (const j of nb) if (j >= 0 && !solid[j] && !outside[j]) { outside[j] = 1; st.push(j); }
      }
    }
    const STEPS = 6;
    const depth = new Float32Array(NC);
    let edge = outside.slice();
    for (let s = 0; s < STEPS; s++) {
      const ne = edge.slice();
      for (let r = 0; r < ROWS; r++) for (let c = 0; c < FCOLS; c++) {
        const i = r * FCOLS + c;
        if (edge[i]) continue;
        let e = r === 0 || c === 0 || r === ROWS - 1 || c === FCOLS - 1;
        for (let dr = -1; dr <= 1 && !e; dr++) for (let dc = -1; dc <= 1; dc++) {
          const rr = r + dr, cc = c + dc;
          if (rr >= 0 && cc >= 0 && rr < ROWS && cc < FCOLS && edge[rr * FCOLS + cc]) { e = true; break; }
        }
        if (e) ne[i] = 1;
      }
      edge = ne;
      for (let i = 0; i < NC; i++) if (!edge[i]) depth[i] += 1 / STEPS;
    }

    const level = new Float32Array(NC);
    const idx = new Uint8Array(NC);
    const glyph = new Uint8Array(NC);
    const color = new Uint8Array(NC);
    const h = (i) => Math.sqrt(depth[i]);
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < FCOLS; c++) {
      const i = r * FCOLS + c;
      if (!solid[i]) continue;
      const m = major[i];
      const look = LOOK[m];
      let b;
      if (m === LEAF) {
        b = Math.min(1, Math.max(0.25, (leafLum[i] - 120) / 110));
      } else {
        const gx = 3 * (h(c < FCOLS - 1 ? i + 1 : i) - h(c > 0 ? i - 1 : i));
        const gy = 3 * (h(r < ROWS - 1 ? i + FCOLS : i) - h(r > 0 ? i - FCOLS : i));
        const nl = Math.hypot(gx, gy, 1);
        const lit = Math.max(0, (-gx * LIGHT[0] - gy * LIGHT[1] + LIGHT[2]) / nl);
        b = Math.min(1, Math.max(0, 0.5 + 0.25 * lit + 0.3 * h(i)));
      }
      let lv = look.floor + (1 - look.floor) * b;
      const same = prev && !moved[i] && m === prev.major[i] && prev.solid[i];
      if (same) lv = prev.level[i] + EASE * (lv - prev.level[i]);
      let gi = 1 + Math.min(NR - 1, Math.floor(lv * NR));
      if (same && prev.idx[i] && Math.abs(lv - (prev.idx[i] - 0.5) / NR) < 1.3 / NR) gi = prev.idx[i];
      if (m === LEAF) gi = Math.min(gi, LEAF_MAX_IDX);
      level[i] = lv; idx[i] = gi;
      glyph[i] = gi;
      color[i] = PAINTS.indexOf(m) * LEVELS + Math.round(Math.min(1, lv) * (LEVELS - 1));
    }
    return { rgb, ink, major, hole, solid, level, idx, glyph, color };
  }

  // ---------------------------------------------------------------- video
  function seek(t) {
    return new Promise((resolve, reject) => {
      // "seeked" alone is enough for drawImage in Chrome; requestVideoFrameCallback never
      // fires while the tab is hidden, so it is not used here.
      const timer = setTimeout(() => reject(new Error("seek timeout")), 8000);
      const ok = () => { clearTimeout(timer); video.removeEventListener("error", bad); resolve(); };
      const bad = () => { clearTimeout(timer); video.removeEventListener("seeked", ok); reject(new Error(video.error ? video.error.message : "video error")); };
      video.addEventListener("seeked", ok, { once: true });
      video.addEventListener("error", bad, { once: true });
      video.currentTime = t;
    });
  }
  // The compressed source has a few packets Chrome fails to decode; the <video> element is
  // dead after that, so replace it and retry. A frame that still fails reuses the last one.
  function newVideo() {
    return new Promise((resolve) => {
      const v = document.createElement("video");
      v.muted = true; v.preload = "auto"; v.playsInline = true;
      v.addEventListener("loadedmetadata", () => resolve(v), { once: true });
      v.src = encodeURI(VIDEO);
      video.replaceWith(v);
      v.id = "video";
      video = v;
    });
  }
  let lastGood = null;
  async function grab(t) {
    for (let attempt = 0; attempt < 3; attempt++) {
      try {
        await seek(t + attempt * 0.004);
        wctx.drawImage(video, 0, 0, FW, FH);
        lastGood = wctx.getImageData(0, 0, FW, FH).data;
        return lastGood;
      } catch (e) {
        log(`decode problem at ${t.toFixed(3)}s (${e.message}); reloading video`);
        await newVideo();
      }
    }
    log(`  giving up on ${t.toFixed(3)}s, repeating previous frame`);
    return lastGood.slice();
  }
  function frameDiff(a, b) {
    let s = 0;
    for (let i = 0; i < a.length; i++) s += Math.abs(a[i] - b[i]);
    return s / a.length;
  }

  // Centre the 4:3 window on the painted character cells of the shot (hair, blush, fur).
  function cropFor(colHist) {
    let total = 0;
    for (const v of colHist) total += v;
    if (!total) return Math.round((FCOLS - COLS) / 2);
    const pct = (p) => { let a = 0; for (let c = 0; c < FCOLS; c++) { a += colHist[c]; if (a >= p * total) return c; } return FCOLS - 1; };
    const centre = (pct(0.04) + pct(0.96)) / 2;
    return Math.max(0, Math.min(FCOLS - COLS, Math.round(centre - COLS / 2)));
  }
  function addHist(hist, f) {
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < FCOLS; c++) {
      const i = r * FCOLS + c;
      const m = f.major[i];
      if (!f.solid[i]) continue;
      if (m === HAIR || m === BLUSH) hist[c] += 3;
      else if (m === FUR) hist[c] += 1;
    }
  }

  // ---------------------------------------------------------------- preview
  const out = document.getElementById("out");
  const octx = out.getContext("2d");
  const atlas = AsciiRenderer.makeAtlas(RAMP, palette);
  function showCropped(f, x0) {
    const NC = ROWS * COLS;
    const g = new Uint8Array(NC), c = new Uint8Array(NC);
    for (let r = 0; r < ROWS; r++) {
      g.set(f.glyph.subarray(r * FCOLS + x0, r * FCOLS + x0 + COLS), r * COLS);
      c.set(f.color.subarray(r * FCOLS + x0, r * FCOLS + x0 + COLS), r * COLS);
    }
    AsciiRenderer.drawFrame(octx, atlas, g, c, 0, ROWS, COLS, SUBX / SUBY);
    const sctx = document.getElementById("src").getContext("2d");
    const sx = (x0 * SUBX) / FW * video.videoWidth;
    sctx.drawImage(video, sx, 0, video.videoWidth * COLS * SUBX / FW, video.videoHeight, 0, 0, 480, 360);
  }
  async function preview() {
    const t = parseFloat(document.getElementById("t").value) || 0;
    // run a few frames before t so easing settles like in the real build
    let prev = null, f = null, last = null;
    const hist = new Float32Array(FCOLS);
    for (let j = 4; j >= 0; j--) {
      const d = await grab(Math.max(0, t - j / FPS));
      if (last && frameDiff(d, last) > CUT) { prev = null; hist.fill(0); }
      last = d;
      const k = furOrPaper(classify(d));
      f = cells(d, k, prev);
      prev = f;
      addHist(hist, f);
    }
    showCropped(f, cropFor(hist));
    statusEl.textContent = `t=${t}s`;
  }

  // ---------------------------------------------------------------- full build
  // Seeking frame by frame re-decodes from the last keyframe every time (very slow), and the
  // per-frame processing is slower than real time. So work in chunks: seek once, play a couple
  // of seconds while only grabbing raw pictures, pause, then process them at leisure.
  // Timers (not requestVideoFrameCallback / rAF) drive the grabbing: those stop whenever the
  // page is not painted (hidden pane, background tab).
  // Output frame fi shows the picture on screen at (fi + 0.5) / FPS.
  const PLAY_RATE = 1.0, CHUNK = 48;
  async function playThrough(frames, consume) {
    // Load the entire MP4 into a memory Blob URL once and play continuously without
    // re-seeking every chunk. Re-seeking every 48 frames lands inside open-GOP B-frame
    // clusters around 35.7s and 61.1s and causes Chrome's decoder to abort that GOP.
    if (!video.src.startsWith("blob:")) {
      const blob = await fetch(encodeURI(VIDEO)).then((r) => r.blob());
      const url = URL.createObjectURL(blob);
      await new Promise((resolve) => {
        video.addEventListener("loadedmetadata", resolve, { once: true });
        video.src = url;
      });
    }
    let next = 0;
    let lastPic = null;
    const dur = video.duration;
    video.pause();
    await seek(0);
    while (next < frames) {
      const chunkEnd = Math.min(dur, (next + CHUNK) / FPS);
      const caps = [];
      const snap = (t) => { wctx.drawImage(video, 0, 0, FW, FH); caps.push({ t, d: wctx.getImageData(0, 0, FW, FH).data }); };
      snap(video.currentTime);
      const ok = await new Promise((resolve) => {
        const v = video;
        let watchdog, done = false;
        const finish = (val) => { if (done) return; done = true; clearTimeout(watchdog); v.pause(); resolve(val); };
        const arm = () => { clearTimeout(watchdog); watchdog = setTimeout(() => finish(false), 5000); };
        const poll = () => {
          if (done) return;
          const m = v.currentTime;
          if (m > caps[caps.length - 1].t) { snap(m); arm(); }
          if (m >= chunkEnd + 0.5 / FPS) { finish(true); return; }
          setTimeout(poll, 4);
        };
        v.onended = () => finish(true);
        v.onerror = () => { log(`decode error near ${caps[caps.length - 1].t.toFixed(2)}s: ${v.error && v.error.message}`); finish(false); };
        v.playbackRate = PLAY_RATE;
        arm();
        v.play().then(poll).catch(() => finish(false));
      });
      const until = ok ? (video.ended ? Infinity : chunkEnd) : Math.max(caps[caps.length - 1].t + 0.2, (next + 1.5) / FPS);
      let ci = 0;
      while (next < frames && (next + 0.5) / FPS < until) {
        const tf = (next + 0.5) / FPS;
        while (ci + 1 < caps.length && caps[ci + 1].t <= tf) ci++;
        lastPic = caps[ci].t <= tf + 0.5 / FPS ? caps[ci].d : (lastPic || caps[ci].d);
        consume(next++, lastPic);
      }
      if (!ok) {
        log(`  resuming at ${(next / FPS).toFixed(2)}s`);
        await newVideo();
        try { await seek(next / FPS); } catch (_) {}
      }
      await new Promise((r) => setTimeout(r, 0));
    }
    video.pause();
  }

  async function build() {
    const dur = video.duration;
    const frames = Math.floor(dur * FPS);
    const NCF = ROWS * FCOLS;
    const allG = new Uint8Array(frames * NCF);
    const allC = new Uint8Array(frames * NCF);
    const shots = [];
    let shot = { start: 0, hist: new Float32Array(FCOLS) };
    let prev = null, last = null;
    const t0 = performance.now();
    const consume = (fi, d) => {
      if (last) {
        const diff = frameDiff(d, last);
        if (diff > CUT) {
          log(`cut @ ${(fi / FPS).toFixed(2)}s (diff ${diff.toFixed(1)})`);
          shot.end = fi; shots.push(shot);
          shot = { start: fi, hist: new Float32Array(FCOLS) };
          prev = null;
        }
      }
      last = d.slice();
      const k = furOrPaper(classify(d));
      const f = cells(d, k, prev);
      prev = f;
      addHist(shot.hist, f);
      allG.set(f.glyph, fi * NCF);
      allC.set(f.color, fi * NCF);
      if (fi % 24 === 0) {
        statusEl.textContent = `${fi}/${frames}  (${((performance.now() - t0) / 1000).toFixed(0)}s)`;
        showCropped(f, cropFor(shot.hist));
      }
      if (fi % 240 === 0 && fi > 0) {
        log(`progress ${fi}/${frames} (${((performance.now() - t0) / 1000).toFixed(1)}s)`);
      }
    };
    await playThrough(frames, consume);
    shot.end = frames; shots.push(shot);

    // crop each shot to its 4:3 window, then delta-code frame to frame for compression
    const NC = ROWS * COLS;
    const planeG = new Uint8Array(frames * NC);
    const planeC = new Uint8Array(frames * NC);
    for (const s of shots) {
      const x0 = cropFor(s.hist);
      log(`shot ${(s.start / FPS).toFixed(2)}-${(s.end / FPS).toFixed(2)}s  crop col ${x0}`);
      for (let fi = s.start; fi < s.end; fi++) {
        for (let r = 0; r < ROWS; r++) {
          const src = fi * NCF + r * FCOLS + x0;
          planeG.set(allG.subarray(src, src + COLS), fi * NC + r * COLS);
          planeC.set(allC.subarray(src, src + COLS), fi * NC + r * COLS);
        }
      }
    }
    const raw = new Uint8Array(frames * NC * 2);
    raw.set(planeG, 0);
    raw.set(planeC, frames * NC);
    for (const base of [0, frames * NC]) {
      for (let i = frames * NC - 1; i >= NC; i--) raw[base + i] = (raw[base + i] - raw[base + i - NC]) & 255;
    }
    const comp = new Uint8Array(await new Response(new Blob([raw]).stream().pipeThrough(new CompressionStream("deflate"))).arrayBuffer());
    let b64 = "";
    for (let i = 0; i < comp.length; i += 0x8000) b64 += String.fromCharCode.apply(null, comp.subarray(i, i + 0x8000));
    b64 = btoa(b64);
    const data = {
      version: 2, fps: FPS, frames, rows: ROWS, cols: COLS, dur, cellAspect: SUBX / SUBY,
      delta: true, ramp: RAMP, palette, dataB64: b64,
    };
    const js = "// Generated by tools/build.html - do not edit by hand.\nwindow.HACHIWARE_ASCII_DATA = " + JSON.stringify(data) + ";\n";
    const res = await fetch("/save?name=ascii_data.js", { method: "POST", body: js });
    log(`${await res.text()}  (${(js.length / 1e6).toFixed(2)} MB, ${shots.length} shots, ${((performance.now() - t0) / 1000).toFixed(0)}s)`);
    statusEl.textContent = "完成";
    window.__buildDone = true;
  }

  video.src = encodeURI(VIDEO);
  video.addEventListener("loadedmetadata", () => {
    log(`video ${video.videoWidth}x${video.videoHeight} ${video.duration.toFixed(2)}s`);
    if (location.search.includes("autobuild=1")) build();
  }, { once: true });
  document.getElementById("btnPreview").onclick = preview;
  document.getElementById("btnBuild").onclick = build;
  // debug: false-colour class map of the frame at t into the left canvas
  window.__classes = async (t) => {
    const d = await grab(t);
    const k = furOrPaper(classify(d));
    const COLS_DBG = { [INK]: [0, 0, 0], [FUR]: [255, 255, 255], [PAPER]: [90, 60, 60], [HAIR]: [60, 120, 255], [BLUSH]: [255, 100, 170], [WOOD]: [200, 120, 40], [LEAF]: [60, 200, 60], [OTHER]: [255, 255, 0], [WHITE]: [255, 0, 0] };
    const id = new ImageData(FW, FH);
    for (let i = 0; i < FW * FH; i++) { const c = COLS_DBG[k[i]]; id.data.set([c[0], c[1], c[2], 255], i * 4); }
    const s = document.getElementById("src");
    s.width = FW; s.height = FH;
    s.getContext("2d").putImageData(id, 0, 0);
  };
  window.__setErode = (n) => { ERODE = n; };
  window.__preview = preview;
  window.__build = build;
})();
</script>
</body>
</html>
